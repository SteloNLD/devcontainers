name: "Prebuild IaC image"

# Triggered by the feature-publishing workflow finishing, not by the push itself.
# Both used to fire on the same push and race: this image installs features from
# ghcr by major tag, and a build that starts seconds after publishing begins
# resolves :1 to the PREVIOUS release. Measured -- publish ran 15:09:08-15:09:54
# while the builds started 15:09:09 and 15:09:11, producing an image with the old
# openbao, gh and packer.
#
# The cost is that this no longer has a paths filter, since workflow_run cannot
# take one: a README-only push to main now rebuilds too. That is a couple of
# minutes, against shipping an image whose contents silently lag the features.
on:
  workflow_run:
    workflows: ["Publish Features and Templates"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/stelonld/devcontainers/iac
  # main publishes :latest; a branch publishes :<branch> so a dispatch can
  # be tested without overwriting the image everyone opens.
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}

jobs:
  # One job per architecture on a native runner; QEMU would emulate every dnf
  # transaction and pipx build in the aarch64 half. useNativeRunner tags each
  # result :<tag>-linux-<arch> for the merge job.
  build:
    # A failed publish means the features in ghcr are not what this commit says,
    # so there is nothing worth building. Scheduled and manual runs have no
    # triggering workflow and must not be gated on it.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      # Let both architectures report, so a break is visibly arch-specific or not.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # On workflow_run, checkout defaults to the branch tip rather than the
          # commit that triggered it, so a second push landing mid-build would be
          # built instead. Falls back to the default ref for schedule/dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: ${{ env.IMAGE_TAG }}
          configFile: templates/iac-spec/.devcontainer/devcontainer.json
          platform: ${{ matrix.platform }}
          useNativeRunner: true
          # always, not filter: merge needs both per-arch images in the registry.
          push: always
          # Features pick downloads by `uname -m`; only the x86_64 branch had ever
          # run. Exec'ing each binary natively is what catches a wrong-arch one.
          runCmd: |
            set -eu
            test "$(uname -m)" = "${{ matrix.arch }}" \
              || { echo "expected ${{ matrix.arch }}, got $(uname -m)"; exit 1; }
            echo "== $(uname -m)"
            # podman is checked at /usr/bin/podman, not through the podman shim: the
            # shim is `sudo -n podman`, and this action remaps the container user's
            # uid to the runner's, after which sudo fails with "PAM account
            # management error". The binary's architecture is what matters here.
            for cmd in \
              "/usr/bin/podman --version" \
              "python3 --version" \
              "pipx --version" \
              "gh --version" \
              "tofu version" \
              "packer version" \
              "tflint --version" \
              "bao version" \
              "pwsh --version" \
              "direnv version" \
              "starship --version" \
              "ansible-navigator --version" \
              "pre-commit --version" \
              "sops --version"
            do
              # Capture, then trim. Piping into `head -1` would hand the pipeline
              # head's status; pipefail would fail on EPIPE from multi-line output.
              if ! out=$(sh -c "$cmd" 2>&1); then
                echo "FAILED on $(uname -m): $cmd"
                echo "$out"
                exit 1
              fi
              printf '%-28s %s\n' "${cmd%% *}" "$(printf '%s\n' "$out" | head -1)"
            done

  # Adds the manifest list :latest points at; per-arch tags stay in the registry.
  # Needs both builds, so a failed arch is never papered over.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: devcontainers/ci/merge@v0.3
        with:
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: ${{ env.IMAGE_TAG }}
          platforms: linux/amd64,linux/arm64
