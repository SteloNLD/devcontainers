name: "Prebuild IaC image"

on:
  push:
    branches:
      - main
    paths:
      - templates/iac-spec/**
      - features/**
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/stelonld/devcontainers/iac
  # main publishes :latest; a branch publishes :<branch> so a dispatch can
  # be tested without overwriting the image everyone opens.
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}

jobs:
  # One job per architecture on a native runner; QEMU would emulate every dnf
  # transaction and pipx build in the aarch64 half. useNativeRunner tags each
  # result :<tag>-linux-<arch> for the merge job.
  build:
    strategy:
      # Let both architectures report, so a break is visibly arch-specific or not.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: ${{ env.IMAGE_TAG }}
          configFile: templates/iac-spec/.devcontainer/devcontainer.json
          platform: ${{ matrix.platform }}
          useNativeRunner: true
          # always, not filter: merge needs both per-arch images in the registry.
          push: always
          # Features pick downloads by `uname -m`; only the x86_64 branch had ever
          # run. Exec'ing each binary natively is what catches a wrong-arch one.
          runCmd: |
            set -eu
            test "$(uname -m)" = "${{ matrix.arch }}" \
              || { echo "expected ${{ matrix.arch }}, got $(uname -m)"; exit 1; }
            echo "== $(uname -m)"
            for cmd in \
              "podman --version" \
              "python3 --version" \
              "pipx --version" \
              "gh --version" \
              "tofu version" \
              "packer version" \
              "tflint --version" \
              "bao version" \
              "pwsh --version" \
              "direnv version" \
              "starship --version" \
              "ansible-navigator --version" \
              "pre-commit --version" \
              "sops --version"
            do
              # Capture, then trim. Piping into `head -1` would hand the pipeline
              # head's status; pipefail would fail on EPIPE from multi-line output.
              if ! out=$(sh -c "$cmd" 2>&1); then
                echo "FAILED on $(uname -m): $cmd"
                echo "$out"
                exit 1
              fi
              printf '%-28s %s\n' "${cmd%% *}" "$(printf '%s\n' "$out" | head -1)"
            done

  # Adds the manifest list :latest points at; per-arch tags stay in the registry.
  # Needs both builds, so a failed arch is never papered over.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: devcontainers/ci/merge@v0.3
        with:
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: ${{ env.IMAGE_TAG }}
          platforms: linux/amd64,linux/arm64
